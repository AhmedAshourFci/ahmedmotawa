<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/ahmedmotawa/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ahmed Motawa — Flutter & Mobile App Developer portfolio.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="motawaweb">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ahmed Motawa | Flutter Developer</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #0a0e1a;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      color: #fff;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(0, 168, 255, .12), transparent 38%),
        #0a0e1a;
      font-family: Arial, sans-serif;
      transition: opacity .25s ease;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .loading-mark {
      display: grid;
      width: 62px;
      height: 62px;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, #00a8ff, #2563eb);
      box-shadow: 0 12px 38px rgba(0, 168, 255, .28);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .loading-title { font-size: 18px; font-weight: 600; }
    .loading-subtitle { margin-top: -10px; color: #8b9bb0; font-size: 13px; }

    .loading-spinner {
      width: 27px;
      height: 27px;
      margin-top: 5px;
      border: 2px solid rgba(255, 255, 255, .16);
      border-top-color: #00a8ff;
      border-radius: 50%;
      animation: loading-spin .8s linear infinite;
    }

    @keyframes loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .loading-spinner { animation-duration: 2.4s; }
      #app-loading { transition: none; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-content">
      <div class="loading-mark" aria-hidden="true">AM</div>
      <div class="loading-title">Ahmed Motawa</div>
      <div class="loading-subtitle">Flutter &amp; Mobile App Developer</div>
      <div class="loading-spinner" aria-hidden="true"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
